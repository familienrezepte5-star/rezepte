name: Rezeptseiten für Bring aktualisieren
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/gen_pages.py
        env:
          FAMILY_CODE: ${{ secrets.FAMILY_CODE }}
      - name: Änderungen speichern
        run: |
          git config user.name "rezepte-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A r
          git diff --cached --quiet || (git commit -m "Rezeptseiten aktualisiert" && git push)
