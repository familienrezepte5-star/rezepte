<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6f4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Kopfzeile, Suche mit Tag-Chips, Kartenraster; Details und Formulare als Dialoge. */
:root {
  --bg: #f3f5ef;
  --card: #ffffff;
  --ink: #1d2b24;
  --muted: #5d6b63;
  --accent: #2f6f4f;
  --accent-ink: #ffffff;
  --butter: #e8b53a;
  --line: #d9dfd3;
  --danger: #b3382c;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a16; --card: #1b2520; --ink: #e8efe9; --muted: #9fb0a5;
    --accent: #6fc196; --accent-ink: #10231a; --butter: #e8b53a;
    --line: #2c3a33; --danger: #ef8a7e; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 16px; }
header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; margin-bottom: 12px; }
header.top h1 { font-size: 1.7rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 14px; font-weight: 600; text-decoration: none; display: inline-block; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 5px 10px; font-size: .9rem; }
input[type=text], input[type=url], input[type=password], input[type=number], input[type=search], textarea {
  width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 12px;
}
textarea { min-height: 110px; resize: vertical; }
label { display: grid; gap: 4px; font-weight: 600; font-size: .95rem; margin-bottom: 12px; }
.filterpanel { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0 0 14px; }
.filterpanel h4 { margin: 8px 0 6px; font-size: .9rem; opacity: .7; }
.filterpanel label { display: inline-flex; gap: 6px; align-items: center; margin: 0 14px 6px 0; }
.planrow { display: grid; grid-template-columns: 38px 64px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.planrow img, .noimg2 { width: 64px; height: 48px; object-fit: cover; border-radius: 8px; background: var(--line); }
.pday small { display: block; font-size: .7rem; }
.pbody .linkbtn { all: unset; cursor: pointer; font-weight: 600; text-align: left; }
.pbody .linkbtn:focus-visible { outline: 3px solid var(--butter); }
.pbtns { display: flex; gap: 4px; }
.daygrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 6px 0; }
.daycol { display: grid; gap: 2px; justify-items: start; }
.ichk { display: inline-flex; gap: 6px; align-items: center; margin: 0 14px 6px 0; }
.starter { margin-top: 4px; font-size: .92rem; }
.pday small { display: block; font-size: .7rem; font-weight: 400; }
.h4 { margin: 12px 0 4px; font-size: .9rem; opacity: .7; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 16px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 3px 12px; font-size: .9rem; }
#favBtn[aria-pressed=true], .chip[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.card .fav { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; padding: 0; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: #b8343c; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.card .fav svg { display: block; }
.card .fav:focus-visible { outline: 3px solid var(--butter); }
.card .open { all: unset; cursor: pointer; display: block; }
.card .open:focus-visible { outline: 3px solid var(--butter); outline-offset: -3px; }
.card img, .card .noimg { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: var(--line); }
.card .noimg { display: grid; place-items: center; color: var(--muted); font-size: .9rem; }
.card .body { padding: 10px 12px 6px; }
.card h3 { font-size: 1.05rem; }
.meta { color: var(--muted); font-size: .88rem; }
.card .pick { padding: 6px 12px 12px; display: flex; gap: 8px; align-items: center; font-size: .92rem; }
dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--bg); color: var(--ink); padding: 0; width: min(680px, calc(100% - 24px)); max-height: calc(100% - 24px); }
dialog::backdrop { background: rgba(10, 20, 15, .55); }
.dlg { padding: 18px; display: grid; gap: 12px; }
.dlg .hero { width: 100%; max-height: 260px; object-fit: cover; border-radius: 12px; }
.stepper { display: inline-flex; align-items: center; gap: 8px; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 1.2rem; line-height: 1; }
ul.ing { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
ul.ing li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.steps { white-space: pre-wrap; }
.err { color: var(--danger); font-weight: 600; }
.ok { color: var(--accent); font-weight: 600; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 12px; font-weight: 600; }
.tabs button[aria-selected=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.shoprow { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
#gate { max-width: 420px; margin: 18vh auto 0; padding: 16px; display: grid; gap: 12px; }
@media (prefers-reduced-motion: no-preference) { .card { transition: transform .12s; } .card:hover { transform: translateY(-2px); } }
</style>
</head>
<body>

<!-- Konfiguration: nach dem Deploy der Edge Function anpassen -->
<script>
  const API = "https://xmirwnrhcngrlnxhkfay.supabase.co/functions/v1/rezepte";
</script>

<div id="gate" hidden>
  <h1>Familienrezepte</h1>
  <p class="meta">Gib den Zugangscode der Familie ein.</p>
  <form id="gateForm" class="dlg" style="padding:0">
    <label for="codeIn">Zugangscode<input id="codeIn" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Weiter</button>
    <div id="gateErr" class="err" role="alert"></div>
  </form>
</div>

<main id="app" class="wrap" hidden>
  <header class="top">
    <h1>Familienrezepte</h1>
    <div class="row">
      <button class="btn primary" id="addBtn">Rezept hinzufügen</button>
      <button class="btn" id="planBtn">Wochenplan</button>
      <button class="btn" id="shopBtn">Einkauf (<span id="shopCount">0</span>)</button>
    </div>
  </header>
  <input id="search" type="search" placeholder="Rezepte durchsuchen (Titel, Zutaten, Tags)" aria-label="Rezepte durchsuchen">
  <div class="row" style="margin:10px 0"><button class="btn" id="favBtn" aria-pressed="false">♡ Favoriten</button><button class="btn" id="filterBtn" aria-expanded="false">Filter</button><button class="btn small" id="filterReset" hidden>Zurücksetzen</button></div>
  <div id="filterPanel" class="filterpanel" hidden></div>
  <div id="status" class="meta" role="status"></div>
  <div id="grid" class="grid"></div>
  <p class="meta" style="margin-top:28px"><button class="btn small" id="logout">Abmelden</button></p>
</main>

<dialog id="dlgView"></dialog>
<dialog id="dlgEdit"></dialog>
<dialog id="dlgAdd"></dialog>
<dialog id="dlgShop"></dialog>
<dialog id="dlgPlan"></dialog>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const httpsOnly = (u) => (/^https:\/\//i.test(u || "") ? u : "");

let code = "";
try { code = localStorage.getItem("familyCode") || ""; } catch {}
let recipes = [];
const activeTags = new Set();
let favs = new Set(); try { favs = new Set(JSON.parse(localStorage.getItem("favs") || "[]")); } catch {}
let onlyFavs = false;
const saveFavs = () => { try { localStorage.setItem("favs", JSON.stringify([...favs])); } catch {} };
const FAV_ON = `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.5 6.5 4.5c2 0 3.7 1.1 4.5 2.7.8-1.6 2.5-2.7 4.5-2.7 3.800 0 5.600 3.900 4.100 7.300C19.500 16.400 12 21 12 21z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
const FAV_OFF = `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.5 6.5 4.5c2 0 3.7 1.1 4.5 2.7.8-1.6 2.5-2.7 4.5-2.7 3.800 0 5.600 3.900 4.100 7.300C19.500 16.400 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
const isSource = (t) => /^(👨‍🍳|📖|💛|👩‍🍳)/u.test(t);
let basket = {}; // Rezept-ID -> gewünschte Portionen
try { basket = JSON.parse(localStorage.getItem("basket") || "{}"); } catch {}
const saveBasket = () => { try { localStorage.setItem("basket", JSON.stringify(basket)); } catch {} };

// ---------- API ----------
async function api(action, payload = {}) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-family-code": code },
    body: JSON.stringify({ action, ...payload }),
  });
  const d = await r.json().catch(() => ({ error: "Ungültige Antwort vom Server." }));
  if (r.status === 401) { logout(); throw new Error("Zugangscode falsch."); }
  if (!r.ok) throw new Error(d.error || "Fehler beim Speichern.");
  return d;
}

// ---------- Zutaten umrechnen ----------
const UNI = { "½": .5, "¼": .25, "¾": .75, "⅓": 1 / 3, "⅔": 2 / 3 };
function parseNum(s) {
  s = s.trim();
  if (UNI[s]) return UNI[s];
  let m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/); if (m) return +m[1] + m[2] / m[3];
  m = s.match(/^(\d+)\/(\d+)$/); if (m) return m[1] / m[2];
  return parseFloat(s.replace(",", "."));
}
const fmtNum = (n) => String(Math.round(n * 100) / 100).replace(".", ",");
function scaleLine(line, f) {
  if (f === 1) return line;
  return line.replace(
    /^(\s*)(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔])(?:(\s*[-–]\s*)(\d+(?:[.,]\d+)?))?/,
    (_, sp, a, dash, b) => sp + fmtNum(parseNum(a) * f) + (dash ? dash + fmtNum(parseNum(b) * f) : "")
  );
}

// ---------- Bring ----------
const PAGE_BASE = "https://familienrezepte5-star.github.io/rezepte/r/";
const recipePageUrl = (r) => r.source_url || (PAGE_BASE + r.id + ".html");
const bringUrl = (r, want) =>
  "https://api.getbring.com/rest/bringrecipes/deeplink?url=" + encodeURIComponent(recipePageUrl(r)) +
  "&source=web&baseQuantity=" + r.servings + "&requestedQuantity=" + want;

async function copyText(t, btn) {
  try { await navigator.clipboard.writeText(t); }
  catch {
    const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch {} ta.remove();
  }
  if (btn) { const o = btn.textContent; btn.textContent = "Kopiert"; setTimeout(() => (btn.textContent = o), 1500); }
}

// ---------- Liste ----------
function render() {
  const q = $("#search").value.trim().toLowerCase();
  const tags = [...new Set(recipes.flatMap((r) => r.tags))].sort((a, b) => a.localeCompare(b, "de"));
  const box = (t) => `<label><input type="checkbox" data-ftag="${esc(t)}" ${activeTags.has(t) ? "checked" : ""}> ${esc(t)}</label>`;
  const panel = $("#filterPanel");
  if (!panel.contains(document.activeElement)) panel.innerHTML = `<h4>Herkunft</h4>${tags.filter(isSource).map(box).join("")}<h4>Weitere</h4>${tags.filter((t) => !isSource(t)).map(box).join("")}`;
  $("#filterBtn").textContent = activeTags.size ? `Filter (${activeTags.size})` : "Filter";
  $("#filterReset").hidden = !activeTags.size;
  const sel = [...activeTags];
  const src = sel.filter(isSource), rest = sel.filter((t) => !isSource(t));
  $("#favBtn").setAttribute("aria-pressed", String(onlyFavs));
  $("#favBtn").textContent = (onlyFavs ? "♥" : "♡") + " Favoriten";
  const list = recipes.filter((r) =>
    (!onlyFavs || favs.has(r.id)) &&
    (!src.length || src.some((t) => r.tags.includes(t))) &&
    rest.every((t) => r.tags.includes(t)) &&
    (!q || (r.title + " " + r.ingredients.join(" ") + " " + r.tags.join(" ")).toLowerCase().includes(q)));
  $("#status").textContent = recipes.length ? `${list.length} von ${recipes.length} Rezepten` : "";
  $("#grid").innerHTML = list.length ? list.map((r) => `
    <article class="card">
      <button class="open" data-open="${esc(r.id)}" aria-label="${esc(r.title)} öffnen">
        ${httpsOnly(r.image_url) ? `<img src="${esc(r.image_url)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<div class="noimg">Kein Bild</div>`}
        <div class="body"><h3>${esc(r.title)}</h3><div class="meta">${r.servings === 1 && r.tags.includes("Backen") ? "1 Ansatz" : r.servings + " Portionen"}${r.tags.length ? " · " + esc(r.tags.slice(0, 2).join(", ")) : ""}</div></div>
      </button>
      <button class="fav" data-fav="${esc(r.id)}" aria-pressed="${favs.has(r.id)}" aria-label="${favs.has(r.id) ? "Aus Favoriten entfernen" : "Als Favorit markieren"}">${favs.has(r.id) ? FAV_ON : FAV_OFF}</button>
      <label class="pick" style="margin:0"><input type="checkbox" data-pick="${esc(r.id)}" ${basket[r.id] ? "checked" : ""}> Auf den Einkaufszettel</label>
    </article>`).join("") : `<div class="empty">${recipes.length ? "Nichts gefunden." : "Noch keine Rezepte. Füge das erste über „Rezept hinzufügen“ hinzu."}</div>`;
  $("#shopCount").textContent = Object.keys(basket).filter((id) => recipes.some((r) => r.id === id)).length;
}

async function load() {
  $("#status").textContent = "Lade Rezepte …";
  try { recipes = (await api("list")).recipes; render(); }
  catch (e) { $("#status").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

// ---------- Detailansicht ----------
function openView(id) {
  const r = recipes.find((x) => x.id === id); if (!r) return;
  const dlg = $("#dlgView");
  let want = basket[id] || r.servings;
  const draw = () => {
    const f = want / r.servings;
    dlg.innerHTML = `<div class="dlg">
      ${httpsOnly(r.image_url) ? `<img class="hero" src="${esc(r.image_url)}" alt="" referrerpolicy="no-referrer">` : ""}
      <h2>${esc(r.title)}</h2>
      <div class="row"><span class="meta">${r.servings === 1 && r.tags.includes("Backen") ? "Ansätze (1 = Originalrezept)" : "Portionen"}</span>
        <span class="stepper"><button data-d="-1" aria-label="Eine Portion weniger">−</button><strong aria-live="polite">${want}</strong><button data-d="1" aria-label="Eine Portion mehr">+</button></span></div>
      <ul class="ing">${r.ingredients.map((i) => `<li>${esc(scaleLine(i, f))}</li>`).join("")}</ul>
      ${r.steps ? `<div class="steps">${esc(r.steps)}</div>` : ""}
      ${r.notes ? `<p class="meta"><strong>Notizen:</strong> ${esc(r.notes)}</p>` : ""}
      <div class="row">
        <a class="btn primary" target="_blank" rel="noopener" href="${esc(bringUrl(r, want))}">Zu Bring</a> <button class="btn" data-copy>Zutaten kopieren</button>
        <button class="btn" data-basket>${basket[id] ? "Vom Einkaufszettel nehmen" : "Auf den Einkaufszettel"}</button>
        ${r.source_url ? `<a class="btn" target="_blank" rel="noopener" href="${esc(r.source_url)}">Original</a>` : ""}
        <button class="btn" data-edit>Bearbeiten</button>
        <button class="btn" data-close>Schließen</button>
      </div></div>`;
    dlg.querySelectorAll("[data-d]").forEach((b) => b.onclick = () => { want = Math.min(100, Math.max(1, want + +b.dataset.d)); if (basket[id]) { basket[id] = want; saveBasket(); } draw(); });
    dlg.querySelector("[data-close]").onclick = () => dlg.close();
    dlg.querySelector("[data-edit]").onclick = () => { dlg.close(); openEdit(r); };
    dlg.querySelector("[data-basket]").onclick = () => { basket[id] ? delete basket[id] : (basket[id] = want); saveBasket(); render(); draw(); };
    const c = dlg.querySelector("[data-copy]"); if (c) c.onclick = () => copyText(r.ingredients.map((i) => scaleLine(i, f)).join("\n"), c);
  };
  draw(); dlg.showModal();
}

// ---------- Bearbeiten / Neu ----------
function openEdit(r = {}) {
  const dlg = $("#dlgEdit");
  dlg.innerHTML = `<form class="dlg" id="editForm">
    <h2>${r.id ? "Rezept bearbeiten" : "Neues Rezept"}</h2>
    <label for="eTitle">Titel<input id="eTitle" type="text" required maxlength="200" value="${esc(r.title)}"></label>
    <label for="eServ">Portionen<input id="eServ" type="number" min="1" max="100" value="${esc(r.servings || 4)}"></label>
    <label for="eIng">Zutaten (eine pro Zeile, z. B. „500 g Mehl“)<textarea id="eIng">${esc((r.ingredients || []).join("\n"))}</textarea></label>
    <label for="eSteps">Zubereitung<textarea id="eSteps">${esc(r.steps)}</textarea></label>
    <label for="eTags">Tags (mit Komma getrennt)<input id="eTags" type="text" value="${esc((r.tags || []).join(", "))}"></label>
    <label for="eSrc">Link zum Original (https)<input id="eSrc" type="url" value="${esc(r.source_url)}"></label>
    <label for="eImg">Bild-Link (https)<input id="eImg" type="url" value="${esc(r.image_url)}"></label>
    <label for="eNotes">Notizen<textarea id="eNotes" style="min-height:70px">${esc(r.notes)}</textarea></label>
    <div id="eErr" class="err" role="alert"></div>
    <div class="row">
      <button class="btn primary" type="submit">Speichern</button>
      <button class="btn" type="button" data-close>Abbrechen</button>
      ${r.id ? `<button class="btn danger" type="button" data-del>Löschen</button>` : ""}
    </div></form>`;
  dlg.querySelector("[data-close]").onclick = () => dlg.close();
  const del = dlg.querySelector("[data-del]");
  if (del) del.onclick = async () => {
    if (!confirm(`„${r.title}“ wirklich löschen?`)) return;
    try { await api("delete", { id: r.id }); delete basket[r.id]; saveBasket(); recipes = recipes.filter((x) => x.id !== r.id); dlg.close(); render(); }
    catch (e) { $("#eErr").textContent = e.message; }
  };
  $("#editForm").onsubmit = async (ev) => {
    ev.preventDefault();
    const lines = (s) => s.split("\n").map((x) => x.trim()).filter(Boolean);
    const rec = {
      id: r.id, title: $("#eTitle").value, servings: $("#eServ").value, ingredients: lines($("#eIng").value),
      steps: $("#eSteps").value, tags: $("#eTags").value.split(",").map((x) => x.trim()).filter(Boolean),
      source_url: $("#eSrc").value, image_url: $("#eImg").value, notes: $("#eNotes").value,
    };
    try {
      const { recipe } = await api("save", { recipe: rec });
      const i = recipes.findIndex((x) => x.id === recipe.id);
      if (i >= 0) recipes[i] = recipe; else recipes.unshift(recipe);
      dlg.close(); render();
    } catch (e) { $("#eErr").textContent = e.message; }
  };
  dlg.showModal();
}

// ---------- Hinzufügen / Import ----------
function openAdd() {
  const dlg = $("#dlgAdd");
  let tab = "one";
  const draw = () => {
    dlg.innerHTML = `<div class="dlg">
      <h2>Rezept hinzufügen</h2>
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="${tab === "one"}" data-tab="one">Ein Link</button>
        <button role="tab" aria-selected="${tab === "many"}" data-tab="many">Viele Links</button>
        <button role="tab" aria-selected="${tab === "own"}" data-tab="own">Selbst schreiben</button>
      </div>

const DAYS = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];

  "Gluten": { re: /mehl|nudel|spaghetti|penne|tagliatelle|fusilli|pasta|tortellini|gnocchi|brot|brötchen|semmel|paniermehl|semmelbrösel|couscous|bulgur|weizen|dinkel|roggen|gerste|lasagne|pizza|wrap|tortilla|maultasche|spätzle|spatzen|schupfnudel|knödel|blätterteig|teig|sojasauce|sojasoße|cracker|panko|ciabatta|baguette|toast|burger|brötchen|mie\b|ramen|udon|croûtons|croutons|bier|haferflocken|grieß|bratwurst/, ok: /glutenfrei|maismehl|reismehl|kartoffelmehl|kichererbsenmehl|reisnudel|glasnudel/g },
  "Nüsse": { re: /nuss|nüsse|mandel|haselnuss|cashew|walnuss|pistazie|pinienkern|erdnuss|macadamia|marzipan|nutella|pesto|pecan|satay|saté|nougat/, ok: /muskatnuss|kokosnuss|\bnussfrei/g },
  "Ei": { re: /(^|[\s,(\d])(eier|eiern|ei|eigelb|eiweiß|eiklar)(?=[\s,).;:]|$)|mayonnaise|mayo\b|aioli|eiernudel|spätzle|pfannkuchen|panade|paniert|schnitzel|frikadelle|hackbällchen|burger patt/, ok: null },
  "Fisch & Meeresfrüchte": { re: /fisch|lachs|thunfisch|garnele|shrimp|scampi|forelle|kabeljau|sardelle|anchovis|meeresfrüchte|krabben|muschel|tintenfisch|surimi|seelachs|hering|worcester/, ok: null },
};
const lsSet = (k, v) => { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v ?? d; } catch { return d; } };
let planCfg = Object.assign({ days: { Mo: 1, Di: 1, Mi: 1, Do: 1, Fr: 0, Sa: 0, So: 0 }, quick: {}, portions: 4, intol: [], onlyFavs: false, starter: false }, lsGet("planCfg", {}));
let plan = lsGet("plan", []); // [{day, date, wk, id, sid, locked, note}]
let planHist = lsGet("planHist", []); // Rezept-IDs der Vorwoche(n)

const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const mondayOf = (d) => { const x = new Date(d); x.setHours(12); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return iso(x); };
const nextDate = (day) => { const t = new Date(); t.setHours(12, 0, 0, 0); const target = (DAYS.indexOf(day) + 1) % 7; t.setDate(t.getDate() + ((target - t.getDay() + 7) % 7)); return iso(t); };
const ymd = (isoStr, add = 0) => { const [y, m, d] = isoStr.split("-").map(Number); const x = new Date(y, m - 1, d + add, 12); return `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}`; };
const fmtDate = (isoStr) => { const [y, m, d] = isoStr.split("-").map(Number); return `${pad(d)}.${pad(m)}.`; };

const ingText = (r) => r.ingredients.join(" | ").toLowerCase();
function hits(r, name) {
  const def = INTOL[name]; let t = ingText(r);
  if (def.ok) t = t.replace(def.ok, " ");
  const m = t.match(def.re);
  return m ? m[0].trim() : null;
}
const conflicts = (r, intol) => intol.filter((n) => hits(r, n));
const proteinKey = (r) => {
  const t = ingText(r) + " " + r.title.toLowerCase();
  if (/hähnchen|huhn|hühn|pute|geflügel|chicken/.test(t)) return "geflügel";
  if (/hack|rind|bolognese|burger/.test(t)) return "hack";
  if (/lachs|fisch|thunfisch|garnele|shrimp/.test(t)) return "fisch";
  if (/schwein|schnitzel|speck|schinken|wurst|würstchen|kassler|braten/.test(t)) return "schwein";
  return "veg";
};
const NOT_MAIN = /^(Backen|Vorspeise|Snack|Getränk|Dessert|Desserts und Süßes|Kuchen|Plätzchen|Frühstück|Salat|Suppen, Saucen und Salate)$/;
const BAD_TITLE = /soße|sauce|dip\b|dressing|marinade|mayo|pesto|aioli|smoothie|limonade|kuchen|torte|plätzchen|cookies|kekse|creme|pudding|dessert|brot\b|brötchen|sorbet|grütze|konfitüre|marmelade|bowle|cocktail|kugeln|mandeln|müsli|oats|baiser/i;
function mainCandidates() {
  return recipes.filter((r) => r.ingredients.length >= 3 && r.steps && !r.tags.some((t) => NOT_MAIN.test(t)) && !/salat\b|suppe/i.test(r.title) && !BAD_TITLE.test(r.title) && r.servings >= 2);
}
function starterCandidates() {
  return recipes.filter((r) => r.ingredients.length >= 3 && r.steps && !r.tags.some((t) => /^(Backen|Getränk|Dessert|Desserts und Süßes|Kuchen)$/.test(t)) && !BAD_TITLE.test(r.title) && (/suppe|salat\b|eintopf/i.test(r.title) || r.tags.some((t) => /^(Suppe|Vorspeise|Salat)$/.test(t))));
}
function pick(day, kind, taken, exclude) {
  const quick = !!planCfg.quick[day]; const intol = planCfg.intol;
  const base = (kind === "starter" ? starterCandidates() : mainCandidates()).filter((r) => !taken.has(r.id) && !exclude.has(r.id) && !conflicts(r, intol).length);
  let pool = base.filter((r) => !planHist.includes(r.id)); // nicht direkt wie in der Vorwoche
  let note = "";
  if (!pool.length) { pool = base; if (pool.length) note = "Wiederholung aus der Vorwoche"; }
  if (planCfg.onlyFavs && kind === "main") { const f = pool.filter((r) => favs.has(r.id)); if (f.length) pool = f; }
  if (quick && kind === "main") { const q = pool.filter((r) => r.tags.includes("Schnell")); if (q.length >= 3) pool = q; else note = note || "Zu wenige schnelle Rezepte"; }
  if (!pool.length) return { r: null, note: "Nichts Passendes gefunden" };
  const used = plan.filter((p) => p.id).map((p) => recipes.find((x) => x.id === p.id)).filter(Boolean);
  const keys = used.map(proteinKey);
  const nudel = used.filter((x) => x.tags.some((t) => /nudel|pasta/i.test(t))).length;
  const scored = pool.map((r) => {
    let sc = Math.random() * 3; if (favs.has(r.id)) sc += 2.5;
    if (kind === "main") {
      const k = proteinKey(r); sc -= keys.filter((x) => x === k).length * (k === "veg" ? 0.8 : 2);
      if (r.tags.some((t) => /nudel|pasta/i.test(t))) sc -= nudel * 1.5;
    }
    return { r, sc };
  }).sort((a, b) => b.sc - a.sc);
  return { r: scored[0].r, note };
}
function makePlan(keepLocked) {
  const thisWk = mondayOf(new Date());
  if (plan.length && plan[0].wk && plan[0].wk !== thisWk) { planHist = plan.flatMap((p) => [p.id, p.sid]).filter(Boolean); lsSet("planHist", planHist); }
  const old = new Map(plan.filter((p) => p.wk === thisWk).map((p) => [p.day, p]));
  const lockedIds = new Set([...old.values()].filter((p) => p.locked).flatMap((p) => [p.id, p.sid]).filter(Boolean));
  const next = [];
  for (const d of DAYS.filter((x) => planCfg.days[x])) {
    const o = old.get(d);
    if (keepLocked && o && o.locked && recipes.some((r) => r.id === o.id)) { next.push(o); continue; }
    plan = next.slice();
    const taken = new Set([...next.flatMap((p) => [p.id, p.sid]), ...lockedIds]);
    const m = pick(d, "main", taken, new Set());
    const entry = { day: d, date: nextDate(d), wk: thisWk, id: m.r ? m.r.id : null, sid: null, locked: false, note: m.note };
    if (planCfg.starter && m.r) { taken.add(m.r.id); const st = pick(d, "starter", taken, new Set()); entry.sid = st.r ? st.r.id : null; }
    next.push(entry);
  }
  plan = next; lsSet("plan", plan);
}
function reroll(day, kind) {

  const key = kind === "starter" ? "sid" : "id";
  const taken = new Set(plan.flatMap((p) => [p.id, p.sid]).filter(Boolean));
  const saved = plan; plan = plan.filter((p) => p.day !== day);
  const { r, note } = pick(day, kind, taken, new Set([cur[key]]));
  plan = saved;
  if (r) { cur[key] = r.id; if (kind === "main") cur.note = note; } else if (kind === "main") cur.note = "Keine andere Auswahl möglich";
  lsSet("plan", plan);
}
const appUrl = () => location.origin + location.pathname;
function calText(p) {
  const r = recipes.find((x) => x.id === p.id), st = recipes.find((x) => x.id === p.sid);

function downloadIcs() {

    const sv = () => lsSet("planCfg", planCfg);
    dlg.querySelector("[data-close]").onclick = () => dlg.close();
    dlg.querySelectorAll("[data-day]").forEach((c) => c.onchange = () => { planCfg.days[c.dataset.day] = c.checked ? 1 : 0; sv(); draw(); });
    dlg.querySelectorAll("[data-quick]").forEach((c) => c.onchange = () => { planCfg.quick[c.dataset.quick] = c.checked ? 1 : 0; sv(); });
    dlg.querySelectorAll("[data-p]").forEach((b) => b.onclick = () => { planCfg.portions = Math.min(20, Math.max(1, planCfg.portions + +b.dataset.p)); sv(); draw(); });
    dlg.querySelectorAll("[data-intol]").forEach((c) => c.onchange = () => { const n = c.dataset.intol; planCfg.intol = c.checked ? [...new Set([...planCfg.intol, n])] : planCfg.intol.filter((x) => x !== n); sv(); draw(); });
    const of = dlg.querySelector("[data-onlyfav]"); of.onchange = () => { planCfg.onlyFavs = of.checked; sv(); };
    const stc = dlg.querySelector("[data-starter]"); stc.onchange = () => { planCfg.starter = stc.checked; sv(); };
    dlg.querySelector("[data-make]").onclick = () => { if (!DAYS.some((d) => planCfg.days[d])) return; makePlan(false); draw(); };
    const mk = dlg.querySelector("[data-makekeep]"); if (mk) mk.onclick = () => { makePlan(true); draw(); };
    dlg.querySelectorAll("[data-lock]").forEach((b) => b.onclick = () => { const p = plan.find((x) => x.day === b.dataset.lock); p.locked = !p.locked; lsSet("plan", plan); draw(); });
    dlg.querySelectorAll("[data-reroll]").forEach((b) => b.onclick = () => { reroll(b.dataset.reroll, "main"); draw(); });
    dlg.querySelectorAll("[data-reroll-s]").forEach((b) => b.onclick = () => { reroll(b.dataset.rerollS, "starter"); draw(); });
    dlg.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => { dlg.close(); openView(b.dataset.open); });
    const ac = dlg.querySelector("[data-accept]"); if (ac) ac.onclick = () => { plan.forEach((p) => { [p.id, p.sid].forEach((id) => { if (id) basket[id] = planCfg.portions; }); }); saveBasket(); render(); dlg.close(); openShop(); };
    const ic = dlg.querySelector("[data-ics]"); if (ic) ic.onclick = downloadIcs;
  };
  draw(); dlg.showModal();
}
$("#planBtn").onclick = openPlan;
</script>
</body>
</html>
