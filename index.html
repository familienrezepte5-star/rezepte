// ---------- Zutaten umrechnen ----------
const UNI = { "½": .5, "¼": .25, "¾": .75, "⅓": 1 / 3, "⅔": 2 / 3 };
function parseNum(s) {
  s = s.trim();
  if (UNI[s]) return UNI[s];
  let m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/); if (m) return +m[1] + m[2] / m[3];
  m = s.match(/^(\d+)\/(\d+)$/); if (m) return m[1] / m[2];
  return parseFloat(s.replace(",", "."));
}
const fmtNum = (n) => String(Math.round(n * 100) / 100).replace(".", ",");
function scaleLine(line, f) {
  if (f === 1) return line;
  return line.replace(
    /^(\s*)(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔])(?:(\s*[-–]\s*)(\d+(?:[.,]\d+)?))?/,
    (_, sp, a, dash, b) => sp + fmtNum(parseNum(a) * f) + (dash ? dash + fmtNum(parseNum(b) * f) : "")
  );
}

};
const ADVENT = /plätzchen|zimtstern|lebkuchen|stollen|vanillekipferl|makrone|gebrannte mandeln|linzer|baumkuchen|husaren|glühwein|kipferl|rumkugel|mozartkugel|nusszopf|printen|marzipan/i;
const seasonKey = (d = new Date()) => { const m = d.getMonth() + 1; return m === 12 || m <= 2 ? "winter" : m <= 5 ? "fruehling" : m <= 8 ? "sommer" : "herbst"; };
function seasonPicks(n = 10) {
  const d = new Date(), key = seasonKey(d), S = SEASONS[key];
  const advent = d.getMonth() + 1 === 11 && d.getDate() >= 15 || d.getMonth() + 1 === 12;
  const dayOfYear = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
  const scored = recipes.filter((r) => !myData.excl[r.id]).map((r, i) => {
    const t = r.title + " " + (r.tags || []).join(" ");
    let sc = S.re.test(r.title) ? 2 : S.re.test(t) ? 1 : 0;
    if (advent && ADVENT.test(r.title)) sc += 3;
    if (key === "winter" || key === "herbst") { if (/salat|sorbet|limonade|bowle|smoothie|kalte|spargel|erdbeer|rhabarber|gurke|caipirinha|sling|cocktail|eis\b|himbeer|pipirrana|wrap|taboul/i.test(r.title)) sc = 0; }
    if (key === "fruehling" && /plätzchen|zimtstern|rotkohl|glühwein|germknödel|fondue/i.test(r.title)) sc = 0;
    if (key === "sommer" && /eintopf|fondue|plätzchen|zimtstern|kassler|rotkohl|glühwein|gratin|germknödel/i.test(r.title)) sc = 0;
    return { r, sc, jit: ((i * 7 + dayOfYear * 13) % 17) / 17 + (httpsOnly(r.image_url) ? 0.3 : 0) };
  }).filter((x) => x.sc > 0);
  return scored.sort((a, b) => (b.sc - a.sc) || (b.jit - a.jit)).slice(0, n).map((x) => x.r);
}
function renderSeason(show) {
  const box = $("#season");
  const picks = show ? seasonPicks() : [];
  if (picks.length < 3) { box.hidden = true; box.innerHTML = ""; return; }
  const S = SEASONS[seasonKey()];
  box.hidden = false;
  box.innerHTML = `<h3 class="seasonh">${S.icon} Passt zur Jahreszeit <small>${S.name}</small></h3><div class="seasonrow">${picks.map((r) => `<button class="scard" data-open="${esc(r.id)}">${httpsOnly(r.image_url) ? `<img src="${esc(r.image_url)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<div class="noimg3"></div>`}<span>${esc(r.title)}</span></button>`).join("")}</div>`;
  box.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => openView(b.dataset.open));
}

// Foto verkleinern (max. 1000 px, JPEG) und als Base64 liefern
function shrinkPhoto(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1000 / Math.max(im.width, im.height));
      const c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.82).split(",")[1]);
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Dieses Bildformat wird nicht unterstützt.")); };
    im.src = url;
  });
}

      const msg = dlg.querySelector("[data-photomsg]"); msg.textContent = "Foto wird hochgeladen …";
      try {

    const c = dlg.querySelector("[data-copy]"); if (c) c.onclick = () => copyText(r.ingredients.map((i) => scaleLine(i, f)).join("\n"), c);
    dlg.querySelector("[data-cook]").onclick = () => { dlg.close(); openCook(r, want); };
    dlg.querySelectorAll("[data-star]").forEach((b) => b.onclick = () => { const n = +b.dataset.star; if (rating === n) delete myData.ratings[id]; else myData.ratings[id] = n; saveMy("ratings"); render(); draw(); });

    dlg.querySelector("#pnote").onchange = (e) => { const v = e.target.value.trim(); if (v) myData.pnotes[id] = v; else delete myData.pnotes[id]; saveMy("pnotes"); };
    dlg.querySelector("[data-cooked]").onclick = () => {

      else myData.cooked[id] = { last: today, n: (cur ? cur.n : 0) + 1, prev: cur ? cur.last : undefined };
      saveMy("cooked"); render(); draw();
    };

// ---------- Allergie-Hinweise (mit Korrektur pro Gerät) ----------
function allergens(r) {
  const auto = Object.keys(INTOL).filter((n) => hits(r, n));
  const f = myData.fix[r.id]; if (!f) return auto;
  return Object.keys(INTOL).filter((n) => (auto.includes(n) && !(f.rem || []).includes(n)) || (f.add || []).includes(n));
}
function setAllergen(r, n, on) {
  const auto = !!hits(r, n);
  const f = myData.fix[r.id] || { add: [], rem: [] };
  f.add = f.add.filter((x) => x !== n); f.rem = f.rem.filter((x) => x !== n);
  if (on && !auto) f.add.push(n);
  if (!on && auto) f.rem.push(n);
  if (!f.add.length && !f.rem.length) delete myData.fix[r.id]; else myData.fix[r.id] = f;
  saveMy("fix");
}

// ---------- Zutaten zusammenfassen ----------
const NUM_RE = /^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔])(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?\s*/;
const UNIT_RE = /^(kg|g|mg|ml|l|cl|el|tl|msp|prise|prisen|pck|päckchen|dose|dosen|becher|bund|zehe|zehen|stück|stk|scheibe|scheiben|glas|gläser|tasse|tassen|würfel|zweig|zweige|blatt|blätter|kopf|köpfe|handvoll|schuss)(?![a-zäöüß])\.?\s*/i;
const SING = { zwiebeln: "zwiebel", tomaten: "tomate", eier: "ei", karotten: "karotte", möhren: "möhre", kartoffeln: "kartoffel", knoblauchzehen: "knoblauchzehe", knoblauchzehe: "knoblauchzehe", paprikas: "paprika", champignons: "champignon", bananen: "banane", äpfel: "apfel", zitronen: "zitrone", limetten: "limette", gurken: "gurke", eigelbe: "eigelb", zucchinis: "zucchini", pilze: "pilz", orangen: "orange", paprikaschoten: "paprikaschote", schalotten: "schalotte", frühlingszwiebeln: "frühlingszwiebel", knoblauch: "knoblauch", brötchen: "brötchen" };
const UNIT_NORM = { zehen: "zehe", prisen: "prise", dosen: "dose", scheiben: "scheibe", gläser: "glas", tassen: "tasse", zweige: "zweig", blätter: "blatt", köpfe: "kopf", stk: "stück", päckchen: "pck", pck: "pck" };
const UNIT_LABEL = { el: "EL", tl: "TL", msp: "Msp.", pck: "Pck.", stück: "Stück", prise: "Prise", dose: "Dose", becher: "Becher", bund: "Bund", zehe: "Zehe", scheibe: "Scheibe", glas: "Glas", tasse: "Tasse", würfel: "Würfel", zweig: "Zweig", blatt: "Blatt", kopf: "Kopf", handvoll: "Handvoll", schuss: "Schuss" };
const PANTRY_RE = /(salz|pfeffer|^wasser|öl\b|^öl|zucker|essig|brühe|pulver|oregano|thymian|rosmarin|zimt|muskat|kurkuma|kreuzkümmel|lorbeer|curry|chili|backpulver|vanille|gewürz)/;
const PANTRY_NOT = /gurke|schote|mais|wurst|zwiebel|kartoffel|paste|soße|sauce|ketchup|butter|sahne|zuckerrübe/;
const isPantry = (nameKey) => PANTRY_RE.test(nameKey) && !PANTRY_NOT.test(nameKey);
function parseIng(line) {
  let t = String(line).trim().replace(/^optional:\s*/i, "");
  let qty = null, unit = "";
  const m = t.match(NUM_RE);
  if (m) {
    qty = parseNum(m[2] || m[1]);
    t = t.slice(m[0].length);
    const u = t.match(UNIT_RE);
    if (u) { unit = u[1].toLowerCase(); t = t.slice(u[0].length); }
  }
  let name = t.replace(/\(.*?\)/g, "").split(",")[0].trim();
  name = name.replace(/^(große[nr]?|kleine[nr]?|mittelgroße[nr]?|frische[nr]?|reife[nr]?|gehackte[nr]?|\d+\s*)\s+/i, "").trim();
  if (!name) return null;
  let key = name.toLowerCase();

    if (!KW.test(sentence) || /haltbar|aufbewahr|hält sich|hält|lager|einfrier|luftdicht|keksdose|vorrat|frisch halten/.test(sentence)) continue;
    for (const m of sentence.matchAll(/(\d+(?:[.,]\d+)?)(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?\s*(stunden|stunde|std\.?|h|minuten|min\.?)(?![a-zäöü])/g)) {

  if (planCfg.onlyFavs && kind === "main") { const f = pool.filter((r) => favs.has(r.id)); if (f.length) pool = f; }
  if (quick && kind === "main") { const q = pool.filter((r) => r.tags.includes("Schnell")); if (q.length >= 3) pool = q; else note = note || "Zu wenige schnelle Rezepte"; }
  if (!pool.length) return { r: null, note: "Nichts Passendes gefunden" };
  const used = plan.filter((p) => p.id).map((p) => recipes.find((x) => x.id === p.id)).filter(Boolean);
  const keys = used.map(proteinKey);
  const nudel = used.filter((x) => x.tags.some((t) => /nudel|pasta/i.test(t))).length;
  const scored = pool.map((r) => {
    let sc = Math.random() * 3; if (favs.has(r.id)) sc += 2.5;
    const ck = myData.cooked[r.id]; sc += ck ? Math.min(daysSince(ck.last), 60) / 30 : 1.2;
    const rt = myData.ratings[r.id]; if (rt) sc += (rt - 3) * 0.6;
    if (kind === "main") {
      const k = proteinKey(r); sc -= keys.filter((x) => x === k).length * (k === "veg" ? 0.8 : 2);
      if (r.tags.some((t) => /nudel|pasta/i.test(t))) sc -= nudel * 1.5;

  const old = new Map(plan.filter((p) => p.wk === thisWk).map((p) => [p.day, p]));
  const lockedIds = new Set([...old.values()].filter((p) => p.locked).flatMap((p) => [p.id, p.sid]).filter(Boolean));
  const next = [];
  for (const d of DAYS.filter((x) => planCfg.days[x])) {
    const o = old.get(d);
    if (keepLocked && o && o.locked && recipes.some((r) => r.id === o.id)) { next.push(o); continue; }
    plan = next.slice();
    const taken = new Set([...next.flatMap((p) => [p.id, p.sid]), ...lockedIds]);
    const m = pick(d, "main", taken, new Set());
    const entry = { day: d, date: nextDate(d), wk: thisWk, id: m.r ? m.r.id : null, sid: null, locked: false, note: m.note };
    if (planCfg.starter && m.r) { taken.add(m.r.id); const st = pick(d, "starter", taken, new Set()); entry.sid = st.r ? st.r.id : null; }
    next.push(entry);
  }
  plan = next; lsSet("plan", plan);
}
function reroll(day, kind) {

  const key = kind === "starter" ? "sid" : "id";
  const taken = new Set(plan.flatMap((p) => [p.id, p.sid]).filter(Boolean));
  const saved = plan; plan = plan.filter((p) => p.day !== day);
  const { r, note } = pick(day, kind, taken, new Set([cur[key]]));
  plan = saved;
  if (r) { cur[key] = r.id; if (kind === "main") cur.note = note; } else if (kind === "main") cur.note = "Keine andere Auswahl möglich";
  lsSet("plan", plan);
}

    <h3 class="ctitle">Eigene Farbe</h3>
    <div class="sv" id="cSV" role="slider" aria-label="Helligkeit und Sättigung" tabindex="0"><i class="svthumb" id="cSVt"></i></div>
    <div class="hue" id="cHue" role="slider" aria-label="Farbton" tabindex="0"><i class="huethumb" id="cHt"></i></div>
    <div class="hexrow"><div class="hexbox"><i class="hexdot" id="cDot"></i><input id="cHex" type="text" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Hex-Farbwert"></div>${canEye ? `<button class="btn eye" type="button" id="cEye" aria-label="Farbe vom Bildschirm aufnehmen">💧</button>` : ""}</div>
    <div class="row"><button class="btn primary" data-close>Fertig</button></div></div>`;
  const sv = $("#cSV"), hue = $("#cHue"), hexIn = $("#cHex");
  const paint = (setInput = true) => {
    const [r, g, b] = hsv2rgb(H, S, V), hex = rgb2hex(r, g, b);
    sv.style.background = `linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl(${H} 100% 50%))`;
    $("#cSVt").style.left = S * 100 + "%"; $("#cSVt").style.top = (1 - V) * 100 + "%"; $("#cSVt").style.background = hex;
    $("#cHt").style.left = (H / 360) * 100 + "%"; $("#cHt").style.background = `hsl(${H} 100% 50%)`;
    $("#cDot").style.background = hex; if (setInput) hexIn.value = hex.toUpperCase();
    return hex;
  };
  const commit = (setInput = true) => {
    const hex = paint(setInput);
    lsSet("customColor", hex); lsSet("color", "custom"); applyColor("custom");
    dlg.querySelectorAll("[data-c]").forEach((x) => x.setAttribute("aria-pressed", "false"));
  };
  const drag = (el, fn) => {
    const move = (e) => { const R = el.getBoundingClientRect(); fn(clamp((e.clientX - R.left) / R.width, 0, 1), clamp((e.clientY - R.top) / R.height, 0, 1)); commit(); };
    el.addEventListener("pointerdown", (e) => { el.setPointerCapture(e.pointerId); move(e); const mv = (ev) => move(ev), up = () => { el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up); }; el.addEventListener("pointermove", mv); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up); });
  };
  drag(sv, (x, y) => { S = x; V = 1 - y; });
  drag(hue, (x) => { H = x * 359.99; });
  sv.onkeydown = (e) => { const st = e.shiftKey ? 0.1 : 0.02; if (e.key === "ArrowRight") S = clamp(S + st, 0, 1); else if (e.key === "ArrowLeft") S = clamp(S - st, 0, 1); else if (e.key === "ArrowUp") V = clamp(V + st, 0, 1); else if (e.key === "ArrowDown") V = clamp(V - st, 0, 1); else return; e.preventDefault(); commit(); };
  hue.onkeydown = (e) => { const st = e.shiftKey ? 20 : 5; if (e.key === "ArrowRight") H = (H + st) % 360; else if (e.key === "ArrowLeft") H = (H - st + 360) % 360; else return; e.preventDefault(); commit(); };
  hexIn.oninput = () => { if (validHex(hexIn.value)) { [H, S, V] = rgb2hsv(...hex2rgb(normHex(hexIn.value))); commit(false); } };
  hexIn.onblur = () => paint();
  const eye = $("#cEye"); if (eye) eye.onclick = async () => { try { const r = await new EyeDropper().open(); [H, S, V] = rgb2hsv(...hex2rgb(r.sRGBHex)); commit(); } catch {} };
  dlg.querySelector("[data-close]").onclick = () => dlg.close();
  dlg.querySelectorAll("[data-c]").forEach((b) => b.onclick = () => { lsSet("color", b.dataset.c); applyColor(b.dataset.c); [H, S, V] = rgb2hsv(...hex2rgb(COLORS[b.dataset.c][1])); paint(); dlg.querySelectorAll("[data-c]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); });
  paint();
  if (!dlg.open) dlg.showModal();
}
applyColor(lsGet("color", "terra"));
$("#colorBtn").onclick = openColor;
</script>
</body>
