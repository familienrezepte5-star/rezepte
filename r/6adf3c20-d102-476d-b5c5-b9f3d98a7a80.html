<h1>Tomatensalat</h1>
<p>Für 4 Portionen</p>
<ul><li>8 Tomaten</li><li>2 rote Zwiebeln</li><li>Salz</li><li>6 EL Olivenöl</li><li>2 EL Rotweinessig</li><li>2-3 EL Wasser</li></ul>
<p>Tomaten in Scheiben schneiden. Zwiebeln in dünne Halbmonde schneiden, mit ÖL, Essig, Wasser und etwas Salz mischen, ca. 10 min stehen lassen. Ggf. nachwürzen.</p>
