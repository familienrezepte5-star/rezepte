<h1>Schoko-Crossies</h1>
<p>Für 4 Portionen</p>
<ul><li>300 g Vollmilchschokolade</li><li>200 g Zartbitterschokolade</li><li>1 EL Butter</li><li>1 Päck. flüssige Vanille</li><li>180 g Cornflakes</li></ul>
