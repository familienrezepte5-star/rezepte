<h1>Bananenwaffeln mit Ei</h1>
<p>Für 1 Portionen</p>
<ul><li>1 Banane</li><li>1 Ei</li><li>20 ml Kokosfett</li><li>60 g Mehl</li><li>¼ TL Backpulver</li><li>35 ml Milch</li></ul>
<p>Bananen klein matschen.</p><p>Kokosfett schmelzen.</p><p>Alle Zutaten vermengen.</p><p>Im Waffeleisen backen.</p>
