<h1>Nudelsalat</h1>
<p>Für 4 Portionen</p>
<ul><li>500 g Nudeln</li><li>Miracle Whip</li><li>Naturjoghurt</li><li>Erbsen</li><li>1 EL Essig</li><li>Salz</li><li>Pfeffer</li></ul>
<p>Nudeln und Erbsen kochen und abkühlen lassen. Miracle Whip mit Joghurt, Salz, Pfeffer, Essig, Erbsen und den Nudeln vermengen. Für mindestens eine Stunde stehen lassen.</p>
